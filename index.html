<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 아이폰 홈 화면에 추가했을 때 앱처럼(주소창 없이) 열리게 하는 설정 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="오늘 할 일">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>오늘 할 일</title>
<style>
  /* ── 색상: 라이트 / 다크 모드 ── */
  :root {
    --bg: #f2f2f7; --card: #ffffff; --text: #1c1c1e; --sub: #8e8e93;
    --line: #e5e5ea; --accent: #0a84ff; --danger: #ff3b30; --warn: #ff9500; --sel: #ffeceb; --green: #34c759;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; --card: #1c1c1e; --text: #f2f2f7; --sub: #8e8e93; --line: #38383a; --sel: #3a1f1d; --green: #30d158; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  body { max-width: 600px; margin: 0 auto;
    padding: env(safe-area-inset-top) 16px calc(100px + env(safe-area-inset-bottom)); }

  /* ── 상단: 날짜 + 진행률 ── */
  header { padding: 16px 0 14px; }
  h1 { font-size: 29.4px; margin: 0; } /* 기존 28px의 105% */
  .progress-text { color: var(--sub); font-size: 15px; margin-top: 4px; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }

  /* ── 할 일 목록 ── */
  ul { list-style: none; margin: 0; padding: 0; }
  li.item { position: relative; margin-bottom: 8px; border-radius: 12px; overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; transition: transform .15s; }
  li.item.dragging { transition: none; z-index: 10; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  /* 빨간 삭제 배경은 밀고 있을 때만 보임 (평소엔 둥근 모서리 틈으로 비치지 않게 숨김) */
  .del-bg { position: absolute; inset: 0; background: var(--danger); color: #fff; font-weight: 600;
    display: none; align-items: center; justify-content: flex-end; padding-right: 20px; }
  li.swiping .del-bg { display: flex; }
  .row { position: relative; background: var(--card); display: flex; align-items: center; gap: 4px;
    min-height: 52px; padding: 4px 12px 4px 4px; }
  .check { width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; }
  .check span { width: 24px; height: 24px; border: 2px solid var(--sub); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; }
  li.done .check span { background: var(--accent); border-color: var(--accent); }
  li.done .check span::after { content: ""; width: 6px; height: 11px; border: solid #fff;
    border-width: 0 2px 2px 0; transform: translate(0, -1px) rotate(45deg); }
  .title { flex: 1; font-size: 17px; line-height: 1.3; padding: 10px 0; word-break: keep-all; overflow-wrap: anywhere; } /* 한글 단어 단위 줄바꿈 */
  li.done .title { color: var(--sub); text-decoration: line-through; }
  .badge { flex: none; font-size: 12px; color: var(--warn); border: 1px solid var(--warn);
    border-radius: 6px; padding: 1px 6px; }
  .memo { flex: none; font-size: 12px; color: var(--sub); }
  .empty { color: var(--sub); text-align: center; padding: 40px 0; font-size: 15px; line-height: 1.6; }
  .hint { color: var(--sub); text-align: center; font-size: 12px; margin-top: 16px; }

  /* ── − (선택 삭제) / + (추가) 버튼 (오른쪽 아래, 엄지 위치) ── */
  .fab-group { position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom));
    display: flex; gap: 12px; z-index: 5; }
  .fab { width: 60px; height: 60px; border-radius: 50%; border: 0; background: var(--accent); color: #fff;
    font-size: 34px; line-height: 1; box-shadow: 0 4px 12px rgba(0,0,0,.25);
    display: flex; align-items: center; justify-content: center; padding: 0; }
  .fab.minus { background: var(--green); color: #fff; }
  .fab.camera, .fab.voice { background: var(--card); color: var(--accent); }

  /* 파일 선택 입력은 화면에 보이지 않게 숨김 (버튼으로 대신 엶) */
  .vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }

  /* ── 사진 메뉴 ── */
  .menu-btn { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 0 14px;
    margin-bottom: 8px; border: 0; border-radius: 12px; background: var(--bg); color: var(--text);
    font-size: 17px; text-align: left; }
  .menu-btn svg { flex: none; color: var(--accent); }
  .wide { width: 100%; }

  /* ── 글자로 할 일 추가 (사진 + 붙여넣기 + 미리보기) ── */
  #scan-img { display: block; width: 100%; max-height: 32vh; object-fit: contain; background: var(--bg);
    border-radius: 10px; margin-bottom: 8px; }
  .scan-status { font-size: 14px; color: var(--sub); margin: 0 0 8px; }
  .scan-status.busy { color: var(--accent); font-weight: 600; }
  .preview-head { font-size: 13px; color: var(--sub); margin: 12px 0 4px; }
  #scan-preview li { display: flex; align-items: center; gap: 10px; min-height: 44px; border-bottom: 1px solid var(--line); }
  #scan-preview input { width: 22px; height: 22px; flex: none; margin: 0; padding: 0; accent-color: var(--accent); }
  #scan-preview span { flex: 1; font-size: 16px; word-break: keep-all; overflow-wrap: anywhere; }
  #scan-preview li.off span { color: var(--sub); text-decoration: line-through; }
  .fab:disabled { opacity: .35; box-shadow: none; }

  /* ── 선택 삭제 모드 ── */
  .select-bar { display: none; position: sticky; top: 0; z-index: 6; background: var(--bg);
    align-items: center; justify-content: space-between; padding: 8px 0; }
  #sel-count { font-size: 16px; font-weight: 600; }
  .delete-bar { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    background: var(--card); border-top: 1px solid var(--line);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .delete-bar .btn { display: block; width: 100%; max-width: 568px; margin: 0 auto; background: var(--danger); color: #fff; }
  .delete-bar .btn:disabled { opacity: .4; }
  body.selecting .select-bar { display: flex; }
  body.selecting .delete-bar { display: block; }
  body.selecting .fab-group, body.selecting .hint { display: none; }
  /* 선택 모드에서는 동그라미가 '선택 표시'로 바뀜 (빨간색 = 삭제 대상) */
  body.selecting li.done .check span { background: none; border-color: var(--sub); }
  body.selecting li.done .check span::after { content: none; }
  body.selecting li.selected .row { background: var(--sel); }
  body.selecting li.selected .check span { background: var(--danger); border-color: var(--danger); }
  body.selecting li.selected .check span::after { content: ""; width: 6px; height: 11px; border: solid #fff;
    border-width: 0 2px 2px 0; transform: translate(0, -1px) rotate(45deg); }

  /* ── 아래에서 올라오는 시트 ── */
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none;
    transition: opacity .2s; z-index: 20; }
  .backdrop.show { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 600px; margin: 0 auto; z-index: 21;
    background: var(--card); border-radius: 16px 16px 0 0; max-height: 85vh; overflow-y: auto;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    transform: translateY(110%); transition: transform .25s; visibility: hidden; }
  .sheet.show { transform: none; visibility: visible; }
  .sheet h2 { font-size: 20px; margin: 4px 0; }
  .sheet .sub { color: var(--sub); font-size: 14px; margin: 0 0 12px; }
  .add-row { display: flex; gap: 8px; }
  input, textarea { width: 100%; font: inherit; font-size: 17px; /* 16px 이상이어야 아이폰이 확대하지 않음 */
    color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  textarea { resize: vertical; }
  label { display: block; font-size: 13px; color: var(--sub); margin-bottom: 12px; }
  label input, label textarea { margin-top: 4px; }
  .btn { min-height: 44px; padding: 0 16px; border-radius: 10px; border: 0; font-size: 16px; font-weight: 600; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.danger { background: transparent; color: var(--danger); }
  .btn.plain { background: transparent; color: var(--accent); }
  .btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  .btns .left { margin-right: auto; }
  #add .btn.plain { width: 100%; margin-top: 8px; }

  /* ── 지난 날 남은 일 카드 ── */
  #carry-list li { display: flex; align-items: center; gap: 4px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  #carry-list .ct { flex: 1; font-size: 16px; word-break: break-all; }
  #carry-list small { display: block; color: var(--sub); font-size: 12px; margin-top: 2px; }
  #carry-list .btn { padding: 0 10px; font-size: 15px; }

  /* ── 하단 알림 (삭제 실행 취소) ── */
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(92px + env(safe-area-inset-bottom)); margin: 0 auto;
    max-width: 480px; background: #333; color: #fff; border-radius: 12px; padding: 4px 4px 4px 16px;
    display: flex; align-items: center; justify-content: space-between; font-size: 15px;
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 30; min-height: 48px; }
  .toast.show { opacity: 1; pointer-events: auto; }
  .toast button { background: none; border: 0; color: #64d2ff; font-size: 15px; font-weight: 600; min-height: 44px; padding: 0 12px; }
</style>
</head>
<body>
<!-- 선택 삭제 모드에서만 보이는 상단 줄 -->
<div class="select-bar">
  <button type="button" id="sel-cancel" class="btn plain">취소</button>
  <span id="sel-count">0개 선택</span>
  <button type="button" id="sel-all" class="btn plain">전체 선택</button>
</div>

<header>
  <h1 id="date"></h1>
  <div id="progress-text" class="progress-text"></div>
  <div class="bar"><div id="bar"></div></div>
</header>

<main>
  <ul id="list"></ul>
  <p id="empty" class="empty">오른쪽 아래 + 버튼으로 오늘 할 일을 추가하세요.<br>하루 10개 안팎이 적당합니다.</p>
  <p class="hint">탭: 수정 · 왼쪽으로 밀기: 삭제 · 길게 눌러 끌기: 순서 변경 · − 버튼: 여러 개 선택 삭제 · 카메라: 사진 글자로 여러 개 추가 · 마이크: 말로 여러 개 추가</p>
</main>

<div class="fab-group">
  <button type="button" id="voice" class="fab voice" aria-label="음성으로 할 일 추가">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/>
    </svg>
  </button>
  <button type="button" id="camera" class="fab camera" aria-label="사진으로 할 일 추가">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.8l1.4-2h6.6l1.4 2h1.8A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/>
      <circle cx="12" cy="13" r="3.8"/>
    </svg>
  </button>
  <button type="button" id="minus" class="fab minus" aria-label="선택해서 삭제">&minus;</button>
  <button type="button" id="fab" class="fab" aria-label="할 일 추가">+</button>
</div>
<!-- 선택 삭제 모드에서만 보이는 하단 삭제 버튼 -->
<div class="delete-bar">
  <button type="button" id="sel-delete" class="btn" disabled>삭제</button>
</div>
<div id="backdrop" class="backdrop"></div>

<!-- 할 일 추가 시트 (F1) -->
<section id="add" class="sheet" role="dialog" aria-label="할 일 추가">
  <form id="add-form" class="add-row">
    <input id="add-input" type="text" maxlength="100" placeholder="할 일 입력 후 엔터" autocomplete="off" enterkeyhint="enter">
    <button type="submit" class="btn primary">추가</button>
  </form>
  <button type="button" class="btn plain" data-close>닫기</button>
</section>

<!-- 사진 선택 입력 (숨김): capture가 있으면 바로 카메라, 없으면 사진 보관함 -->
<input type="file" id="cam-input" class="vh" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
<input type="file" id="album-input" class="vh" accept="image/*" tabindex="-1" aria-hidden="true">

<!-- 사진 메뉴: 찍기 / 앨범 / 사진 없이 -->
<section id="photo-menu" class="sheet" role="dialog" aria-label="사진으로 할 일 추가">
  <h2>사진으로 할 일 추가</h2>
  <p class="sub">사진 속 글자를 읽어 한 줄에 할 일 1개로 추가합니다.</p>
  <button type="button" id="pm-text" class="menu-btn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16M8 10h8M8 14h5"/></svg>
    카메라로 글자 스캔 (가장 정확)
  </button>
  <button type="button" id="pm-camera" class="menu-btn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.8l1.4-2h6.6l1.4 2h1.8A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.8"/></svg>
    사진 찍어 자동 인식
  </button>
  <button type="button" id="pm-album" class="menu-btn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="9.5" r="1.8"/><path d="M21 16l-5-5-9 9"/></svg>
    앨범 사진 자동 인식
  </button>
  <button type="button" class="btn plain wide" data-close>취소</button>
</section>

<!-- 글자로 할 일 여러 개 추가: 사진 보기 + 붙여넣기 칸 + 줄별 미리보기 -->
<section id="scan" class="sheet" role="dialog" aria-label="글자로 할 일 추가">
  <h2 id="scan-title">글자로 할 일 추가</h2>
  <div id="scan-photo" hidden>
    <img id="scan-img" alt="선택한 사진">
  </div>
  <!-- 자동 인식 진행 상태 (사진: 준비 중 → 인식 중 % → 완료 / 음성: 듣는 중 → 완료) -->
  <p id="scan-status" class="scan-status" hidden></p>
  <textarea id="scan-text" rows="4"></textarea>
  <p id="scan-head" class="preview-head" hidden></p>
  <ul id="scan-preview"></ul>
  <div class="btns">
    <button type="button" class="btn plain" data-close>취소</button>
    <button type="button" id="scan-add" class="btn primary" disabled>추가</button>
  </div>
</section>

<!-- 상세·수정 시트 (F3) -->
<section id="edit" class="sheet" role="dialog" aria-label="할 일 수정">
  <label>제목<input id="edit-title" type="text" maxlength="100" autocomplete="off"></label>
  <label>메모<textarea id="edit-memo" rows="3"></textarea></label>
  <div class="btns">
    <button type="button" id="edit-delete" class="btn danger left">삭제</button>
    <button type="button" class="btn plain" data-close>취소</button>
    <button type="button" id="edit-save" class="btn primary">저장</button>
  </div>
</section>

<!-- 지난 날 남은 일 정리 (F6) — 모두 결정해야 닫힘 -->
<section id="carry" class="sheet" role="dialog" aria-label="지난 날 남은 일">
  <h2 id="carry-title"></h2>
  <p class="sub">오늘로 옮길 일과 지울 일을 정해 주세요.</p>
  <ul id="carry-list"></ul>
  <div class="btns">
    <button type="button" id="carry-del-all" class="btn danger left">모두 삭제</button>
    <button type="button" id="carry-all" class="btn primary">모두 오늘로</button>
  </div>
</section>

<div id="toast" class="toast" role="status">
  <span id="toast-msg"></span>
  <button type="button" id="toast-undo">실행 취소</button>
</div>

<script>
(() => {
  'use strict';

  // ════════ 저장 (F7): 폰 안의 브라우저 저장소(localStorage)에 보관 ════════
  const KEY = 'todo-app.v1';
  const $ = (s) => document.querySelector(s);

  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && Array.isArray(s.tasks)) return s;
    } catch (e) { /* 저장된 값이 없거나 깨졌으면 새로 시작 */ }
    return { tasks: [] };
  }
  let state = load();

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { toast('저장하지 못했습니다. 저장 공간을 확인하세요.', false); }
  }

  // ════════ 유틸리티 ════════
  // 기기 시간(KST) 기준 날짜 문자열 'YYYY-MM-DD' — 하루의 경계는 자정
  function todayKey(d = new Date()) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function uid() {
    return (crypto.randomUUID && crypto.randomUUID()) || Date.now().toString(36) + Math.random().toString(36).slice(2);
  }
  // 제목을 화면에 넣을 때 HTML 특수문자를 무해하게 바꿈
  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const find = (id) => state.tasks.find((t) => t.id === id);

  // 오늘 할 일: 미완료가 위, 완료가 아래. 각 그룹 안에서는 사용자가 정한 순서
  function todays() {
    const k = todayKey();
    return state.tasks.filter((t) => t.date === k).sort((a, b) => (a.done - b.done) || (a.order - b.order));
  }
  function nextOrder() {
    const k = todayKey();
    return state.tasks.filter((t) => t.date === k).reduce((m, t) => Math.max(m, t.order), -1) + 1;
  }

  // ════════ 화면 그리기 (F5 진행률 포함) ════════
  const listEl = $('#list');
  let shownDate = '';

  function render() {
    const now = new Date();
    shownDate = todayKey(now);
    $('#date').textContent = `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일 (${'일월화수목금토'[now.getDay()]})`;

    const list = todays();
    const done = list.filter((t) => t.done).length;
    $('#progress-text').textContent = list.length ? `완료 ${done} / ${list.length}` : '오늘 할 일이 없습니다';
    $('#bar').style.width = list.length ? (done / list.length * 100) + '%' : '0';
    $('#minus').disabled = list.length === 0;

    // 선택 목록에서 오늘 목록에 없는 항목은 정리
    const ids = new Set(list.map((t) => t.id));
    [...selected].forEach((id) => { if (!ids.has(id)) selected.delete(id); });

    listEl.innerHTML = list.map((t) => `
      <li class="item${t.done ? ' done' : ''}${selecting && selected.has(t.id) ? ' selected' : ''}" data-id="${t.id}">
        <div class="del-bg">삭제</div>
        <div class="row">
          <div class="check"><span></span></div>
          <div class="title">${esc(t.title)}</div>
          ${!t.done && t.carriedCount >= 3 ? `<span class="badge">${t.carriedCount}회 미룸</span>` : ''}
          ${t.memo ? '<span class="memo">메모</span>' : ''}
        </div>
      </li>`).join('');
    $('#empty').hidden = list.length > 0;
    if (selecting) updateSelUI(list.length);
  }

  // ════════ 선택 삭제 모드 (− 버튼) ════════
  let selecting = false;
  const selected = new Set();

  function enterSelect() {
    if (!todays().length) return;
    selecting = true;
    selected.clear();
    document.body.classList.add('selecting');
    render();
  }
  function exitSelect() {
    selecting = false;
    selected.clear();
    document.body.classList.remove('selecting');
    render();
  }
  function toggleSel(id) {
    if (selected.has(id)) selected.delete(id); else selected.add(id);
    render();
  }
  function updateSelUI(total) {
    const n = selected.size;
    $('#sel-count').textContent = `${n}개 선택`;
    $('#sel-all').textContent = n === total && total > 0 ? '전체 해제' : '전체 선택';
    $('#sel-delete').disabled = n === 0;
    $('#sel-delete').textContent = n ? `${n}개 삭제` : '삭제할 항목을 선택하세요';
  }
  $('#minus').addEventListener('click', enterSelect);
  $('#sel-cancel').addEventListener('click', exitSelect);
  $('#sel-all').addEventListener('click', () => {
    const list = todays();
    if (selected.size === list.length) selected.clear();
    else list.forEach((t) => selected.add(t.id));
    render();
  });
  $('#sel-delete').addEventListener('click', () => {
    const ids = [...selected];
    if (!ids.length) return;
    exitSelect();
    removeTasks(ids);
  });

  // ════════ 기본 동작: 추가(F1) · 완료(F2) · 삭제(F3) ════════
  function addTask(title) {
    title = title.trim().slice(0, 100);
    if (!title) return false;
    state.tasks.push({
      id: uid(), title, memo: '', date: todayKey(), order: nextOrder(),
      done: false, doneAt: null, carriedCount: 0, createdAt: new Date().toISOString(),
    });
    save(); render();
    return true;
  }

  function toggle(id) {
    const t = find(id);
    if (!t) return;
    t.done = !t.done;
    t.doneAt = t.done ? new Date().toISOString() : null;
    save(); render();
  }

  // 삭제: 여러 개를 한 번에 지우고, 실행 취소 때 원래 자리로 되돌릴 수 있게 위치를 기억
  let lastDeleted = null, toastTimer = null;
  function removeTasks(ids) {
    const set = new Set(ids);
    const removed = [];
    state.tasks.forEach((t, i) => { if (set.has(t.id)) removed.push({ task: t, index: i }); });
    if (!removed.length) return;
    state.tasks = state.tasks.filter((t) => !set.has(t.id));
    lastDeleted = removed; // 앞쪽 위치부터 순서대로 기록됨
    save(); render();
    toast(removed.length === 1 ? '삭제했습니다' : `${removed.length}개 삭제했습니다`, true);
  }
  const removeTask = (id) => removeTasks([id]);
  function undoDelete() {
    if (!lastDeleted) return;
    // 앞쪽 위치부터 다시 끼워 넣으면 모두 원래 자리로 돌아감
    lastDeleted.forEach(({ task, index }) => state.tasks.splice(index, 0, task));
    lastDeleted = null;
    save(); render(); hideToast();
  }

  // 5초간 보이는 하단 알림. 실행 취소는 이 5초 안에만 가능
  function toast(msg, withUndo) {
    $('#toast-msg').textContent = msg;
    $('#toast-undo').hidden = !withUndo;
    $('#toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { hideToast(); lastDeleted = null; }, 5000);
  }
  function hideToast() { $('#toast').classList.remove('show'); }
  $('#toast-undo').addEventListener('click', undoDelete);

  // ════════ 시트 열기/닫기 ════════
  let openSheet = null;
  function showSheet(el) {
    if (openSheet && openSheet !== el) closeSheet(true);
    openSheet = el;
    el.classList.add('show');
    $('#backdrop').classList.add('show');
    fitKeyboard();
  }
  // force=false면 '지난 날 남은 일' 카드는 닫지 않음 (결정을 해야 닫힘)
  function closeSheet(force) {
    if (!openSheet) return;
    if (openSheet.id === 'carry' && !force) return;
    if (openSheet.id === 'scan') cleanupScan(); // 사진은 저장하지 않고 닫을 때 메모리에서 지움
    document.activeElement && document.activeElement.blur();
    openSheet.classList.remove('show');
    openSheet.style.bottom = '';
    openSheet = null;
    $('#backdrop').classList.remove('show');
  }
  $('#backdrop').addEventListener('click', () => closeSheet(false));
  document.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => closeSheet(false)));

  // 아이폰 키보드가 올라오면 시트를 키보드 위로 올림
  function fitKeyboard() {
    if (!openSheet || !window.visualViewport) return;
    const vv = window.visualViewport;
    openSheet.style.bottom = Math.max(0, window.innerHeight - vv.height - vv.offsetTop) + 'px';
  }
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', fitKeyboard);
    visualViewport.addEventListener('scroll', fitKeyboard);
  }

  // ── 추가 시트: 엔터마다 저장, 입력창은 열린 채 유지 → 연속 입력 ──
  $('#fab').addEventListener('click', () => {
    $('#add-input').value = '';
    showSheet($('#add'));
    $('#add-input').focus(); // 탭 직후 바로 호출해야 아이폰 키보드가 뜸
  });
  $('#add-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = $('#add-input');
    if (addTask(input.value)) input.value = '';
    input.focus();
  });

  // ════════ 사진·글자로 할 일 여러 개 추가 (아이폰 '텍스트 인식' 활용) ════════
  let scanUrl = null, scanLines = [];
  const unchecked = new Set(); // 미리보기에서 체크를 해제한 줄

  $('#camera').addEventListener('click', () => showSheet($('#photo-menu')));
  // 파일 선택창은 탭 직후 바로 열어야 아이폰이 막지 않음 → 먼저 열고 메뉴를 닫음
  // 사진을 고르는 동안 인식 엔진을 미리 준비해 기다리는 시간을 줄임
  $('#pm-camera').addEventListener('click', () => { $('#cam-input').click(); closeSheet(false); warmOcr(); });
  $('#pm-album').addEventListener('click', () => { $('#album-input').click(); closeSheet(false); warmOcr(); });
  // 아이폰 기본 '텍스트 스캔'(라이브 텍스트): 카메라로 비춘 글자를 입력칸에 바로 넣음 → 가장 정확
  $('#pm-text').addEventListener('click', () => {
    openScan(null, 'text');
    setStatus("입력칸을 한 번 더 누르면 나오는 메뉴에서 '텍스트 스캔'을 누르고, 글자를 비춘 뒤 '삽입'을 누르세요.", true);
    $('#scan-text').focus();
  });
  ['#cam-input', '#album-input'].forEach((s) => $(s).addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = ''; // 같은 사진을 다시 골라도 동작하게 비움
    if (file) openScan(file);
  }));

  // mode: 'photo'(사진 자동 인식) / 'voice'(음성) / 'text'(붙여넣기·텍스트 스캔)
  let scanMode = 'text';
  function openScan(file, mode) {
    cleanupScan();
    scanMode = file ? 'photo' : (mode || 'text');
    $('#scan-title').textContent = scanMode === 'voice' ? '음성으로 할 일 추가' : '글자로 할 일 추가';
    $('#scan-text').value = '';
    $('#scan-text').placeholder = {
      photo: '인식된 글자가 여기에 표시됩니다 (틀린 글자는 고칠 수 있음)',
      voice: '말한 내용이 여기에 표시됩니다 (틀린 글자는 고칠 수 있음)',
      text: "여기에 붙여 넣기\n또는 이 칸을 길게 눌러 '텍스트 스캔'으로 바로 찍기",
    }[scanMode];
    unchecked.clear();
    if (file) { scanUrl = URL.createObjectURL(file); $('#scan-img').src = scanUrl; }
    $('#scan-photo').hidden = !file;
    setStatus('', false);
    renderPreview();
    showSheet($('#scan'));
    if (file) runOcr();
  }
  function cleanupScan() {
    scanToken++; // 진행 중인 인식 결과는 버림
    if (scanUrl) { URL.revokeObjectURL(scanUrl); scanUrl = null; }
    $('#scan-img').removeAttribute('src');
  }
  function setStatus(text, busy) {
    const el = $('#scan-status');
    el.hidden = !text;
    el.textContent = text;
    el.classList.toggle('busy', !!busy);
  }

  // ── 음성 입력: 아이폰 키보드의 받아쓰기(🎤) 사용 ──
  // 웹 음성 인식(Web Speech API)은 홈 화면 앱에서 첫 사용 이후 글자가 오지 않고 오타도 많아,
  // Siri와 같은 엔진을 쓰는 키보드 받아쓰기로 바꿈. 받아쓴 말은 쉼표·마침표·'그리고' 등에서 할 일로 나뉨.
  $('#voice').addEventListener('click', () => {
    openScan(null, 'voice');
    setStatus("키보드의 마이크(🎤) 버튼을 누르고 말하세요. 할 일 사이에 '그리고'라고 하거나 잠깐 쉬면 나뉩니다.", true);
    $('#scan-text').focus(); // 버튼을 누른 직후 바로 해야 아이폰 키보드가 올라옴
  });

  // ── 글자 자동 인식: Tesseract.js (무료 오픈소스, 사진은 폰 밖으로 나가지 않음) ──
  // 버전을 고정해 두어 엔진이 예고 없이 바뀌지 않게 함. 한글·영어 인식 데이터는 처음 한 번만 내려받아 폰에 저장됨
  const OCR = {
    script: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
    workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',
    corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1',
    // 사진 긴 변을 이 픽셀 이하로 줄여 인식. 측정 결과(인쇄 문서 사진) 2000px → 3000px에서
    // 글자 오류율 8.9% → 1.9%로 감소. (흑백 보정은 종이 테두리를 글자로 오인해 오히려 나빠져 쓰지 않음)
    maxSide: 3000,
  };
  let ocrWorkerP = null, ocrLog = null, scanToken = 0;

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src; s.onload = resolve; s.onerror = () => reject(new Error('script'));
      document.head.appendChild(s);
    });
  }
  function getWorker() {
    if (!ocrWorkerP) {
      ocrWorkerP = (async () => {
        if (!window.Tesseract) await loadScript(OCR.script);
        const w = await Tesseract.createWorker('kor+eng', 1, {
          workerPath: OCR.workerPath, corePath: OCR.corePath,
          logger: (m) => ocrLog && ocrLog(m),
        });
        await w.setParameters({ preserve_interword_spaces: '1' }); // 한글 띄어쓰기 유지
        return w;
      })();
      ocrWorkerP.catch(() => { ocrWorkerP = null; }); // 실패하면 다음 사진 때 다시 시도
    }
    return ocrWorkerP;
  }
  function warmOcr() { if (navigator.onLine !== false || window.Tesseract) getWorker().catch(() => {}); }

  // 사진을 적당한 크기로 줄여 캔버스에 그림 (<img>를 거치면 아이폰 사진의 회전 정보가 반영됨)
  async function photoCanvas() {
    const img = $('#scan-img');
    await img.decode();
    const k = Math.min(1, OCR.maxSide / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * k);
    c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c;
  }

  // 인식 결과 정리: 잡티 기호를 지우고, 글자·숫자가 2개 미만인 줄(얼룩·선 등)은 버림
  function cleanOcr(text) {
    return text.split(/\r?\n/)
      .map((l) => l.replace(/[|_~`]+/g, ' ').replace(/\s+/g, ' ').trim())
      .filter((l) => (l.match(/[가-힣A-Za-z0-9]/g) || []).length >= 2)
      .join('\n');
  }

  async function runOcr() {
    const token = ++scanToken;
    const alive = () => token === scanToken; // 그사이 화면을 닫거나 다른 사진을 고르면 false
    setStatus('인식 엔진 준비 중…', true);
    ocrLog = (m) => {
      if (!alive()) return;
      if (m.status === 'recognizing text') setStatus(`글자 인식 중… ${Math.round(m.progress * 100)}%`, true);
      else if (/load/.test(m.status)) setStatus('인식 엔진 준비 중… (처음 한 번은 약 8 MB를 내려받습니다)', true);
    };
    try {
      const [canvas, worker] = await Promise.all([photoCanvas(), getWorker()]);
      if (!alive()) return;
      const { data } = await worker.recognize(canvas);
      if (!alive()) return;
      const text = cleanOcr(data.text || '');
      $('#scan-text').value = text;
      renderPreview();
      // 사진 가장자리·책상 무늬를 글자로 오인한 줄은 처음부터 체크 해제 (지우지는 않음 → 진짜면 다시 체크)
      //  - 한글이 없고 글자·숫자가 4개 미만 (예: 'DE', 'i')
      //  - 한글·숫자·띄어쓰기 없이 영문만 붙은 한 단어 (예: 'aia', 'ESSERE')
      const suspicious = (t) => !/[가-힣]/.test(t) &&
        ((t.match(/[A-Za-z0-9]/g) || []).length < 4 || (!/\s/.test(t) && !/\d/.test(t)));
      scanLines.filter(suspicious).forEach((t) => unchecked.add(t));
      renderPreview();
      setStatus(text
        ? '인식 완료 · 틀린 글자는 위 칸에서 고치고, 필요 없는 줄은 체크를 해제하세요.'
        : '글자를 찾지 못했습니다. 글자가 화면을 채우도록 가까이, 밝게 찍어 보세요.', false);
    } catch (e) {
      if (!alive()) return;
      setStatus(navigator.onLine === false && !window.Tesseract
        ? '글자 인식을 처음 쓸 때는 인터넷 연결이 필요합니다. 연결 후 다시 시도하세요.'
        : '글자 인식에 실패했습니다. 다시 시도하거나 아래 칸에 직접 입력하세요.', false);
    }
  }

  // 한 줄 = 할 일 1개. 줄 앞의 '1.', '-', '•', '①' 같은 머리 기호는 지우고, 빈 줄·중복 줄은 뺌
  const BULLET = /^\s*(?:[-–—*•·∙▪▫◦○●□■☐☑✓✔>]+|\(?\d{1,2}[.)](?=\s)|[①-⑳])\s*/;
  function parseLines(text) {
    const seen = new Set(), out = [];
    text.split(/\r?\n/).forEach((line) => {
      const t = line.replace(BULLET, '').replace(/\s+/g, ' ').trim().slice(0, 100);
      if (t && !seen.has(t)) { seen.add(t); out.push(t); }
    });
    return out;
  }

  // 말은 줄바꿈이 없으므로 '쉼표·마침표·물음표', '그리고·그다음·다음으로'에서 할 일을 나눔
  // (단 3.5, 1,000처럼 숫자 사이의 점·쉼표는 나누지 않음)
  const SPEECH_JOINER = /(^|\n|\s)(?:그리고|그 ?다음에?|다음으로)(?=\s|$)/g;
  function splitSpeech(text) {
    return text
      .replace(/\s*(?:(?<!\d)[.,]|[.,](?!\d)|[!?。，])\s*/g, '\n')
      .replace(SPEECH_JOINER, '\n');
  }

  function renderPreview() {
    const raw = $('#scan-text').value;
    scanLines = parseLines(scanMode === 'voice' ? splitSpeech(raw) : raw);
    [...unchecked].forEach((t) => { if (!scanLines.includes(t)) unchecked.delete(t); });
    $('#scan-preview').innerHTML = scanLines.map((t, i) => `
      <li${unchecked.has(t) ? ' class="off"' : ''}>
        <input type="checkbox" data-i="${i}"${unchecked.has(t) ? '' : ' checked'} aria-label="추가할 항목">
        <span>${esc(t)}</span>
      </li>`).join('');
    const n = scanLines.length - unchecked.size;
    $('#scan-head').hidden = !scanLines.length;
    $('#scan-head').textContent = `${scanLines.length}줄 인식 · 한 줄 = 할 일 1개 (체크 해제하면 제외)`;
    $('#scan-add').disabled = n === 0;
    $('#scan-add').textContent = n ? `${n}개 추가` : '추가';
  }
  $('#scan-text').addEventListener('input', renderPreview);
  $('#scan-preview').addEventListener('click', (e) => {
    const li = e.target.closest('li');
    if (!li) return;
    const cb = li.querySelector('input');
    if (e.target !== cb) cb.checked = !cb.checked; // 글자를 눌러도 체크 전환
    const t = scanLines[Number(cb.dataset.i)];
    if (cb.checked) unchecked.delete(t); else unchecked.add(t);
    renderPreview();
  });
  $('#scan-add').addEventListener('click', () => {
    const titles = scanLines.filter((t) => !unchecked.has(t));
    if (!titles.length) return;
    const k = todayKey(), now = new Date().toISOString();
    let order = nextOrder();
    titles.forEach((title) => state.tasks.push({
      id: uid(), title, memo: '', date: k, order: order++,
      done: false, doneAt: null, carriedCount: 0, createdAt: now,
    }));
    save();
    closeSheet(false);
    render();
    toast(`${titles.length}개 추가했습니다`, false);
  });

  // ── 수정 시트 ──
  let editId = null;
  function openEdit(id) {
    const t = find(id);
    if (!t) return;
    editId = id;
    $('#edit-title').value = t.title;
    $('#edit-memo').value = t.memo || '';
    showSheet($('#edit'));
  }
  $('#edit-save').addEventListener('click', () => {
    const t = find(editId);
    const title = $('#edit-title').value.trim().slice(0, 100);
    if (!title) { $('#edit-title').focus(); return; }
    if (t) { t.title = title; t.memo = $('#edit-memo').value.trim(); save(); render(); }
    closeSheet(false);
  });
  $('#edit-delete').addEventListener('click', () => {
    const id = editId;
    closeSheet(false);
    removeTask(id);
  });

  // ════════ 지난 날 남은 일 이월 (F6) ════════
  function staleTasks() {
    const k = todayKey();
    return state.tasks.filter((t) => !t.done && t.date < k)
      .sort((a, b) => a.date.localeCompare(b.date) || a.order - b.order);
  }
  function carryOne(t) {
    t.date = todayKey();
    t.carriedCount = (t.carriedCount || 0) + 1;
    t.order = nextOrder(); // 오늘 목록 맨 아래에 붙임
  }
  function checkCarry() {
    const stale = staleTasks();
    if (!stale.length) {
      if (openSheet && openSheet.id === 'carry') closeSheet(true);
      return;
    }
    $('#carry-title').textContent = `지난 날 남은 일 ${stale.length}개`;
    $('#carry-list').innerHTML = stale.map((t) => `
      <li data-id="${t.id}">
        <div class="ct">${esc(t.title)}
          <small>${t.date.slice(5).replace('-', '/')}${t.carriedCount ? ` · 이미 ${t.carriedCount}회 이월` : ''}</small>
        </div>
        <button type="button" class="btn plain" data-act="carry">오늘로</button>
        <button type="button" class="btn danger" data-act="del">삭제</button>
      </li>`).join('');
    if (selecting) exitSelect();
    if (openSheet !== $('#carry')) showSheet($('#carry'));
  }
  $('#carry-list').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const id = btn.closest('li').dataset.id;
    if (btn.dataset.act === 'carry') { const t = find(id); if (t) carryOne(t); }
    else state.tasks = state.tasks.filter((t) => t.id !== id);
    save(); render(); checkCarry();
  });
  $('#carry-all').addEventListener('click', () => {
    staleTasks().forEach(carryOne);
    save(); render(); checkCarry();
  });
  $('#carry-del-all').addEventListener('click', () => {
    if (!confirm('지난 날 남은 일을 모두 삭제할까요?')) return;
    const ids = new Set(staleTasks().map((t) => t.id));
    state.tasks = state.tasks.filter((t) => !ids.has(t.id));
    save(); render(); checkCarry();
  });

  // 앱을 켜 둔 채 자정이 지나거나, 다음 날 다시 열었을 때 날짜를 갱신
  function refreshIfNewDay() {
    if (todayKey() !== shownDate) { render(); checkCarry(); }
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshIfNewDay(); });
  setInterval(refreshIfNewDay, 30000);

  // ════════ 목록 손가락 조작: 탭 / 왼쪽 밀기(삭제) / 길게 눌러 끌기(F4 순서 변경) ════════
  const LONG_PRESS_MS = 450, MOVE_TOL = 10, SWIPE_DELETE_PX = 90;
  let g = null; // 진행 중인 손가락 동작 정보

  function gStart(target, x, y) {
    const li = target.closest('li.item');
    if (!li) return;
    const t = find(li.dataset.id);
    g = { li, id: li.dataset.id, x0: x, y0: y, mode: 'pending', dx: 0, onCheck: !!target.closest('.check') };
    // 미완료 항목만 길게 눌러 순서 변경 가능 (선택 모드에서는 끄기)
    if (t && !t.done && !selecting) g.timer = setTimeout(startDrag, LONG_PRESS_MS);
  }

  function gMove(e, x, y) {
    if (!g) return;
    const dx = x - g.x0, dy = y - g.y0;
    if (g.mode === 'pending') {
      if (!selecting && Math.abs(dx) > MOVE_TOL && Math.abs(dx) > Math.abs(dy)) { clearTimeout(g.timer); g.mode = 'swipe'; }
      else if (Math.abs(dx) > MOVE_TOL || Math.abs(dy) > MOVE_TOL) { clearTimeout(g.timer); g.mode = 'scroll'; } // 일반 스크롤
    }
    if (g.mode === 'swipe') {
      e.preventDefault();
      g.dx = Math.min(0, dx); // 왼쪽으로만
      g.li.classList.add('swiping');
      const row = g.li.querySelector('.row');
      row.style.transition = 'none';
      row.style.transform = `translateX(${g.dx}px)`;
    } else if (g.mode === 'drag') {
      e.preventDefault();
      dragMove(dy);
    }
  }

  function gEnd() {
    if (!g) return;
    clearTimeout(g.timer);
    const cur = g;
    g = null;
    if (cur.mode === 'pending') {
      if (selecting) toggleSel(cur.id);          // 선택 모드: 탭하면 선택/해제
      else if (cur.onCheck) toggle(cur.id); else openEdit(cur.id);
    } else if (cur.mode === 'swipe') {
      if (cur.dx < -SWIPE_DELETE_PX) removeTask(cur.id);
      else {
        const row = cur.li.querySelector('.row');
        row.style.transition = 'transform .2s';
        row.style.transform = '';
        setTimeout(() => cur.li.classList.remove('swiping'), 200); // 제자리로 돌아온 뒤 빨간 배경 숨김
      }
    } else if (cur.mode === 'drag') {
      dragEnd(cur);
    }
  }

  function gCancel() {
    if (!g) return;
    clearTimeout(g.timer);
    g = null;
    render();
  }

  function startDrag() {
    if (!g || g.mode !== 'pending') return;
    const items = [...listEl.querySelectorAll('li.item:not(.done)')];
    g.mode = 'drag';
    g.items = items;
    g.from = g.to = items.indexOf(g.li);
    // 항목 한 칸의 높이(간격 포함)
    g.step = items.length > 1 ? items[1].getBoundingClientRect().top - items[0].getBoundingClientRect().top : g.li.offsetHeight;
    g.li.classList.add('dragging');
  }

  function dragMove(dy) {
    const n = g.items.length;
    // 미완료 목록 범위 안에서만 움직이도록 제한
    dy = Math.max(-g.from * g.step, Math.min((n - 1 - g.from) * g.step, dy));
    const to = Math.round(g.from + dy / g.step);
    g.li.style.transform = `translateY(${dy}px)`;
    g.items.forEach((el, i) => {
      if (el === g.li) return;
      let s = 0;
      if (g.from < to && i > g.from && i <= to) s = -g.step; // 아래로 끌면 사이 항목들이 한 칸 위로
      if (g.from > to && i < g.from && i >= to) s = g.step;  // 위로 끌면 한 칸 아래로
      el.style.transform = s ? `translateY(${s}px)` : '';
    });
    g.to = to;
  }

  function dragEnd(cur) {
    const ids = cur.items.map((el) => el.dataset.id);
    const [moved] = ids.splice(cur.from, 1);
    ids.splice(cur.to, 0, moved);
    ids.forEach((id, i) => { const t = find(id); if (t) t.order = i; });
    // 완료 항목은 미완료 뒤 순서로 다시 번호를 매김
    todays().filter((t) => t.done).forEach((t, i) => { t.order = ids.length + i; });
    save(); render();
  }

  // 아이폰: 터치 이벤트
  let lastTouch = 0;
  listEl.addEventListener('touchstart', (e) => {
    lastTouch = Date.now();
    if (e.touches.length > 1) { gCancel(); return; }
    gStart(e.target, e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  listEl.addEventListener('touchmove', (e) => {
    gMove(e, e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false }); // 끌기·밀기 중 화면 스크롤을 막기 위해 passive:false
  listEl.addEventListener('touchend', (e) => {
    lastTouch = Date.now();
    // 탭 후 따라오는 가짜 클릭이 방금 연 시트를 닫지 않도록 막음
    if (g && g.mode !== 'scroll') e.preventDefault();
    gEnd();
  });
  listEl.addEventListener('touchcancel', gCancel);

  // PC 확인용: 마우스 이벤트 (터치 직후 따라오는 마우스 이벤트는 무시)
  listEl.addEventListener('mousedown', (e) => {
    if (Date.now() - lastTouch < 800 || e.button !== 0) return;
    gStart(e.target, e.clientX, e.clientY);
    const mm = (ev) => gMove(ev, ev.clientX, ev.clientY);
    const mu = () => {
      window.removeEventListener('mousemove', mm);
      window.removeEventListener('mouseup', mu);
      gEnd();
    };
    window.addEventListener('mousemove', mm);
    window.addEventListener('mouseup', mu);
  });

  // ════════ 시작 ════════
  render();
  checkCarry();

  // 오프라인 동작용 서비스 워커 등록 (https 또는 localhost에서만 동작)
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* 실패해도 앱은 동작 */ });
  }
})();
</script>
</body>
</html>
